    <script>
        document.getElementById("signup-form").addEventListener("submit", async (e) => {
            e.preventDefault();

            const email = document.getElementById("email").value;
            const username = document.getElementById("username").value;
            const password = document.getElementById("password").value;

            try {
                // Supabase signup API call
                const { data, error } = await supabase.auth.signUp({
                    email: email,  // Use email for registration
                    password: password
                });

                // Handle error during signup
                if (error) {
                    showNotification('Signup failed: ' + error.message, 'error');
                } else {
                    // If signup is successful, show success message and redirect
                    showNotification('Signup successful! Please check your email for a confirmation link.', 'info');
                    setTimeout(() => {
                        window.location.href = "login.html";  // Redirect to login page after signup
                    }, 3000);
                }
            } catch (error) {
                console.error('Signup error:', error);
                showNotification('Failed to sign up. Please try again later.', 'error');
            }
        });
    </script>

    <!-- Include Supabase client -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.0.0/dist/umd/supabase.min.js"></script>

    <script>
        // Initialize the Supabase client (replace with your actual Supabase credentials)
        const supabase = supabase.createClient(
            'https://lfpohlqfxxbtzpzmiqny.supabase.co',  // Replace with your Supabase URL
            'your-supabase-anon-key'  // Replace with your Supabase Anon Key
        );
    </script>
